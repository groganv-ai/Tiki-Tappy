<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TikiTapper · Set piece flow demo</title><base href="../"><link rel="icon" href="assets/tikitapper-icon.png"><style>
:root{--ink:#193e35;--dark:#143f36;--lime:#d6ee83;--paper:#f5f5ed;--muted:#657565;--line:#dce2d5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px system-ui,sans-serif}button,select{font:inherit;color:inherit}button{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 15px;min-height:46px;font-weight:650;cursor:pointer;touch-action:manipulation}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #ad8b26;outline-offset:2px}button.primary,.selected{background:var(--dark)!important;color:white!important;border-color:var(--dark)!important}button:disabled{opacity:.5;cursor:default}button.small{font-size:11px;min-height:38px;padding:8px 10px}header{background:var(--dark);padding:20px max(20px,calc((100vw - 1080px)/2));color:#fff;display:flex;align-items:center;justify-content:space-between;gap:18px}.logo{width:200px;display:block}header small{display:block;color:#c4d9be;margin-top:4px;font-size:11px}header a{color:var(--lime);font-size:12px;text-decoration:none}main{max-width:1120px;margin:24px auto;padding:0 20px 40px}.intro{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}h1{font-size:26px;margin:0 0 7px;letter-spacing:-.6px}h2{font-size:21px;margin:0 0 16px}h3{font-size:13px;margin:0 0 12px}.muted,.hint{color:var(--muted);font-size:12px;line-height:1.6}.hint{margin:10px 0 0}.eyebrow{font-size:10px;font-weight:750;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}.layout{display:grid;grid-template-columns:1fr 1.15fr;gap:20px;align-items:start}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}.score{background:var(--dark);color:white}.score .eyebrow{color:#c4d9be;text-align:center}.scoreline{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center;margin:20px 0}.scoreline strong{font-size:24px;line-height:1.2}.scoreline b{font-size:36px;color:var(--lime)}.scorers{display:grid;grid-template-columns:1fr 1fr;gap:20px;border-block:1px solid #ffffff20;padding:10px 0;font-size:12px}.scorers>div:last-child{text-align:right}.scorers p{margin:7px 0}.scorers small{display:block;color:#c4d9be}.clock{text-align:center;font-size:30px;font-family:ui-monospace,monospace;color:var(--lime);margin:14px 0 6px}.clock-note{text-align:center;font-size:10px;color:#c4d9be}.setpiece-main{display:flex;align-items:center;gap:13px;width:100%;background:#e7f1cc;border-color:#bfd294;text-align:left;padding:18px;margin:14px 0}.setpiece-main svg{width:36px;height:36px;flex-shrink:0}.setpiece-main strong{font-size:19px;display:block}.setpiece-main small{font-size:11px;color:var(--muted);display:block;margin-top:5px}.tools,.tabs{display:flex;gap:8px;flex-wrap:wrap}.tools button{flex:1;font-size:12px}.tabs{display:grid;grid-template-columns:1fr 1fr;margin-bottom:16px}.tabs button{font-size:12px}.counts{width:100%;border-collapse:collapse;font-size:12px}.counts td,.counts th{padding:11px 5px;border-bottom:1px solid var(--line);text-align:center}.counts th:first-child,.counts td:first-child{text-align:left}.counts th{font-size:10px;color:var(--muted)}.moment{padding:14px 0;border-bottom:1px solid var(--line)}.moment-head{display:flex;align-items:center;gap:10px;font-size:13px}.moment-head svg{width:22px;height:22px;flex-shrink:0}.moment-head time{font-size:10px;color:var(--muted);margin-left:auto;white-space:nowrap}.moment p{margin:7px 0;font-size:12px;line-height:1.6}.moment .chain{border-left:2px solid #bbcd98;padding-left:12px;margin-top:10px}.moment .tools{margin-top:10px}.empty{padding:24px 0;color:var(--muted);font-size:13px;line-height:1.6}.pill{display:inline-block;font-size:10px;background:#edf2e5;color:var(--muted);padding:4px 7px;border-radius:8px}.modal{position:fixed;inset:0;z-index:5;background:#102e2999;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}.sheet{background:var(--paper);border-radius:20px;padding:24px;max-width:540px;width:100%;max-height:94dvh;overflow:auto}.flow-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}.flow-head button{min-width:44px;padding:8px}.flow-head .eyebrow{line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{min-height:68px;text-align:left}.grid button strong{display:block;font-size:15px}.grid button small{display:block;font-size:11px;color:var(--muted);margin-top:6px}.choices{display:grid;gap:9px}.choices button{text-align:left;min-height:55px}.field{margin:20px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:9px}.field select{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:white}.segmented{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.segmented.three{grid-template-columns:repeat(3,1fr)}.quality{background:#eaf0e2;padding:16px;border:1px solid var(--line);border-radius:13px;margin-bottom:24px}.quality>div{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.quality button{font-size:12px;padding:10px 5px;line-height:1.4;min-height:56px}.players{border-top:1px solid var(--line);padding-top:20px}.players>div{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.players button{padding:10px 4px;min-height:55px}.wide{width:100%;margin-top:16px}.opponent.selected{background:#813e36!important;border-color:#813e36!important}.banner{background:#edf2e5;border-radius:12px;padding:13px;font-size:12px;line-height:1.6;margin-bottom:16px}.flow-player{font-weight:700;margin:0 0 16px}.v2-pitch-label{font-size:10px;display:flex;justify-content:space-between}.v2-pitch{position:relative;aspect-ratio:360/560;background:#326749;max-width:390px;margin:auto;border-radius:8px;overflow:hidden}.v2-pitch>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.v2-pitch button{position:absolute;min-height:0;padding:0;background:transparent;border:1px dashed #d9ecc440;border-radius:0;color:#e7f3d9;font-size:10px;font-weight:400}.v2-pitch button:hover,.v2-pitch button:focus-visible{background:#d6ee8355}.v2-zone-list{font-size:12px;margin-top:12px}.v2-zone-list summary{padding:10px 0;cursor:pointer}.v2-choices{display:grid;gap:7px}.v2-choices button{text-align:left}.v2-wide{width:100%;margin-top:12px}footer{max-width:1080px;margin:auto;padding:18px 20px;text-align:center;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}#feedback{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--dark);color:white;border-radius:12px;padding:14px 20px;z-index:8;max-width:90vw;font-size:13px;box-shadow:0 6px 30px #0003}#feedback:empty{display:none}.report-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:12px;padding:12px 0;border-bottom:1px solid var(--line)}.report-row div:last-child{text-align:right}.report-row small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.demo-note{padding:13px 16px;border:1px dashed #b8c79c;border-radius:12px;font-size:12px;color:var(--muted);margin-bottom:20px;line-height:1.6}.section-title{display:flex;align-items:center;gap:8px}.section-title svg{width:24px;height:24px}
@media(max-width:760px){header{padding:15px 18px}.logo{width:170px}header a{font-size:11px}main{padding:0 12px 30px;margin-top:18px}.intro{align-items:flex-start;flex-direction:column;gap:10px}.intro .tools{width:100%}.layout{grid-template-columns:1fr;gap:0}.card{padding:18px}.scoreline strong{font-size:21px}.scoreline b{font-size:32px}.modal{padding:8px}.sheet{padding:20px;max-height:97dvh}.grid button{padding:13px 10px}h1{font-size:24px}.quality{padding:13px}.quality button{font-size:11px}.segmented button{font-size:12px}}
</style></head><body><header><div><img class="logo" src="assets/tikitapper-wordmark.png?v=30" alt="TikiTapper"><small>AFC Whitchurch U10s</small></div><a href="./">Back to live app ↗</a></header><main id="app"></main><footer>Flow demo · Not connected to saved matches<br>© 2026 Vincent Grogan. All rights reserved.</footer><div id="modal"></div><div id="feedback" role="status" aria-live="polite"></div><script>
const squad=['Haydo','Cae','E.J','Hughesy','Macca','Dyls','Coops','Richy','Rafa'],types=['Corner','Free kick','Penalty'];
const quality={Goal:['Great goal','Amazing goal','Worldie goal'],Shot:['Good effort','Great strike','Incredible strike'],Save:['Good save','Great save','Incredible save']};
let nominatedKeeper='E.J';
let records=[],flow=null,reportView='report',clockStart=Date.now(),feedbackTimer=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tacticsIcon(){return `<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="1.5" width="21" height="21" rx="3"/><path d="m4.5 5 4 4m0-4-4 4m10.5 8 4 4m0-4-4 4"/><circle cx="17" cy="6.5" r="2"/><circle cx="6" cy="17.5" r="2"/><path d="M10 6.5h3M9 17.5q8 0 8-6" stroke-dasharray="1 2.5"/><path d="m15 13 2-2 2 2"/></svg>`}
function fmt(ms){const sec=Math.floor(ms/1000);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function now(){return 12*60000+Math.max(0,Date.now()-clockStart)}
function announce(text){$('#feedback').textContent=text;clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>$('#feedback').textContent='',3000)}
function totals(){return types.map(type=>({type,ours:records.filter(r=>r.type===type&&!r.opp).length,opposition:records.filter(r=>r.type===type&&r.opp).length}))}
function tally(){return [false,true].map(opp=>records.filter(r=>r.opp===opp&&r.outcome?.kind==='Goal').length)}
function goalLines(opp){return records.filter(r=>r.opp===opp&&r.outcome?.kind==='Goal').map(r=>`<p>${opp?'':esc(r.outcome.player)+' · '}${fmt(r.outcome.at)}${r.outcome.assist?`<small>Assist: ${esc(r.outcome.assist.player)} · ${fmt(r.outcome.at)}</small>`:''}</p>`).join('')||'<p>—</p>'}
function resultText(r){const o=r.outcome;if(!o)return 'No linked key action';if(o.save)return o.save.quality+' · '+o.save.player+' — opponent '+o.quality.toLowerCase();return (r.opp?'Opposition':o.player)+' · '+o.quality+(o.kind==='Shot'?' · '+o.result.toLowerCase():'')+(o.assist?' · assist '+o.assist.player:'')}
function timeline(){return records.map((r,i)=>`<div class="moment"><div class="moment-head">${tacticsIcon()}<b>${esc(r.type)} · ${r.opp?'Opposition':'Blues'}</b><time>${fmt(r.at)}</time></div><p>${r.taker?esc(r.taker)+' · ':''}${esc(r.locationLabel||'Location not recorded')}</p>${r.outcome?`<div class="chain"><b>${esc(resultText(r))}</b><p>${fmt(r.outcome.at)} · ${r.outcome.kind==='Goal'?'Goal from ':r.outcome.save?'Save following ':'Shot from '}${r.type.toLowerCase()}${r.outcome.assist?' · '+esc(r.outcome.assist.player)+' → '+esc(r.outcome.player):''}</p></div>`:'<p class="muted">Restart recorded · outcome can be added later.</p>'}<div class="tools"><button class="small" onclick="openResult('${r.id}')">${r.outcome?'Change':'Add'} outcome</button>${r.outcome?`<button class="small" onclick="removeResult('${r.id}')">Remove outcome</button>`:''}</div></div>`).join('')||'<div class="empty">Record a set piece to see its linked events here.</div>'}
function renderHome(){const score=tally();$('#app').innerHTML=`<div class="intro"><div><div class="eyebrow">Interactive flow demo</div><h1>From set piece to key moment.</h1><div class="muted">Try the capture steps, then review how they appear in the report.</div></div><div class="tools"><button onclick="loadExample()">Load example</button><button onclick="resetDemo()">Reset demo</button></div></div><div class="demo-note">This demo is temporary. It doesn’t read or change your saved teams, matches or events. Refreshing starts again.</div><div class="layout"><div><div class="card score"><div class="eyebrow">Match in progress · demo</div><div class="scoreline"><strong>Blues (Phil)</strong><b>${score.join('–')}</b><strong>Riverside Juniors</strong></div><div class="scorers"><div>${goalLines(false)}</div><div>${goalLines(true)}</div></div><div class="clock" id="clock">${fmt(now())}</div><div class="clock-note">1st half · Demo clock running</div></div><div class="card"><h2>Record a restart</h2><div class="field"><label for="nominatedKeeper">Nominated goalkeeper</label><select id="nominatedKeeper" onchange="nominateKeeper(this.value)"><option value="">Not nominated</option>${squad.map(n=>`<option ${n===nominatedKeeper?'selected':''}>${n}</option>`).join('')}</select><p class="hint">Defaults to this player for saves from opposition set pieces. Changes apply to future saves.</p></div><button class="setpiece-main" onclick="startSetPiece()">${tacticsIcon()}<span><strong>Set piece</strong><small>Corner · Free kick · Penalty</small></span></button><p class="hint">Proposed as a separate button below the five normal action columns, in both modes.</p><div class="tools" style="margin-top:16px"><button onclick="undoLast()" ${records.length?'':'disabled'}>↶ Undo last set piece</button></div><p class="hint">Undo removes that restart and its linked outcome together.</p></div><div class="card"><h2>Highlight selection</h2><p class="hint">Routine restarts stay out of highlights. Goals, shots and keeper saves remain linked to their set-piece context.</p>${records.filter(r=>r.outcome).map(r=>`<p style="font-size:12px">${r.outcome.save?'🧤':r.outcome.kind==='Goal'?'⚽':'◎'} ${esc(resultText(r))}<br><span class="muted">From ${r.opp?'an opposition ':''}${r.type.toLowerCase()}</span></p>`).join('')||'<div class="empty">No linked highlights yet.</div>'}</div></div><div class="card"><div class="tabs"><button class="${reportView==='report'?'selected':''}" onclick="reportView='report';renderHome()">Report preview</button><button class="${reportView==='timeline'?'selected':''}" onclick="reportView='timeline';renderHome()">Timeline</button></div>${reportView==='report'?`<h2 class="section-title">${tacticsIcon()} Set pieces</h2><table class="counts"><thead><tr><th>Type</th><th>Blues</th><th>Opposition</th></tr></thead><tbody>${totals().map(t=>`<tr><td>${t.type}</td><td>${t.ours}</td><td>${t.opposition}</td></tr>`).join('')}</tbody></table><h2 style="margin-top:24px">Linked key actions</h2>${records.filter(r=>r.outcome).map(r=>`<div class="report-row"><div><b>${esc(r.type)} → ${r.outcome.save?'Save':r.outcome.kind}</b><small>${fmt(r.outcome.at)}</small></div><div>${esc(resultText(r))}</div></div>`).join('')||'<div class="empty">Add a goal, shot or saved opposition shot to see the connection.</div>'}<button class="wide" onclick="reportView='timeline';renderHome()">See timeline & add outcomes ↗</button>`:`<h2>Set-piece timeline</h2>${timeline()}`}</div></div>`}
function startSetPiece(){flow={stage:'type',draft:{id:crypto.randomUUID(),at:now(),opp:false,taker:'',cornerSide:'Unknown'},quality:0};drawFlow()}
function chooseType(i){if(flow.draft.type!==types[i]){delete flow.draft.locationLabel;delete flow.draft.point}flow.draft.type=types[i];applyAssumedLocation();flow.stage='details';drawFlow()}
function applyAssumedLocation(){const d=flow.draft;if(d.type==='Corner'){d.locationLabel=d.cornerSide==='Unknown'?'Corner · side not specified':d.cornerSide+' corner';d.point=d.cornerSide==='Unknown'?null:{x:(d.cornerSide==='Left')!==d.opp?.05:.95,y:d.opp?.965:.035}}else if(d.type==='Penalty'){d.locationLabel=d.opp?'Our penalty spot (assumed)':'Opposition penalty spot (assumed)';d.point={x:.5,y:d.opp?.8:.2}}else if(!d.locationLabel){d.locationLabel='Free kick · location not recorded';d.point=null}}
function setTeam(opp){flow.draft.opp=opp;flow.draft.taker='';if(flow.draft.type==='Free kick'){delete flow.draft.locationLabel;delete flow.draft.point}applyAssumedLocation();drawFlow()}
function setCorner(side){flow.draft.cornerSide=side;applyAssumedLocation();drawFlow()}
function saveRestart(){const d=flow.draft;applyAssumedLocation();const i=records.findIndex(r=>r.id===d.id);if(i<0)records.push(JSON.parse(JSON.stringify(d)));else {const changed=records[i].opp!==d.opp||records[i].type!==d.type;records[i]={...records[i],...JSON.parse(JSON.stringify(d))};if(changed)delete records[i].outcome}flow.recordId=d.id;flow.stage='result';renderHome();drawFlow();announce(d.type+' recorded')}
function openResult(id){const r=records.find(r=>r.id===id);if(!r)return;flow={stage:'result',draft:JSON.parse(JSON.stringify(r)),recordId:id,quality:0};drawFlow()}
function chooseResult(kind){if(kind==='none')return closeFlow();flow.outcome={kind,at:now(),quality:quality[kind][0]};flow.quality=0;if(flow.draft.opp){if(kind==='Goal'){flow.outcome.player='Opposition';flow.outcome.quality='Goal';return requestShotLocation()}flow.stage='opposition-shot'}else if(flow.draft.type==='Penalty'&&kind==='Goal'&&flow.draft.taker){flow.outcome.player=flow.draft.taker;flow.stage='penalty-scorer'}else flow.stage='player';drawFlow()}
function qualityPanel(kind){return `<section class="quality"><h3>${kind==='Save'?'Save quality':'Quality'}</h3><div>${quality[kind].map((q,i)=>`<button class="${flow.quality===i?'selected':''}" aria-pressed="${flow.quality===i}" onclick="flow.quality=${i};drawFlow()">${q}</button>`).join('')}</div></section>`}
function playerButtons(stage){const names=squad.filter(n=>stage!=='assist-player'||n!==flow.outcome.player);return `<section class="players"><h3>${stage==='keeper'?'Our keeper':stage==='assist-player'?'Assist by':'Player'}</h3><div>${names.map(n=>`<button data-name="${esc(n)}" onclick="choosePlayer(this.dataset.name)">${esc(n)}</button>`).join('')}</div></section>`}
function choosePlayer(name){if(!squad.includes(name))return;if(flow.stage==='keeper'){flow.outcome.save={player:name,quality:quality.Save[flow.quality]};return finishOutcome()}if(flow.stage==='assist-player'){flow.outcome.assist={player:name};flow.stage='assist-location';return drawFlow()}flow.outcome.player=name;flow.outcome.quality=quality[flow.outcome.kind][flow.quality];if(flow.outcome.kind==='Goal')return requestShotLocation();flow.stage='shot-result';drawFlow()}
function chooseShotResult(i){flow.outcome.result=['Saved','Off target','Blocked'][i];if(flow.draft.opp)flow.outcome.quality=quality.Shot[flow.quality];requestShotLocation()}
function requestShotLocation(){if(flow.draft.type==='Penalty'){flow.outcome.locationLabel=flow.draft.locationLabel;flow.outcome.point=flow.draft.point;return afterShotLocation()}flow.stage='shot-location';drawFlow()}
function chooseDemoZone(i){const z=demoZones()[i],where={locationLabel:z?.label||'Location unknown',point:z?{x:(z.x+z.w/2)/360,y:(z.y+z.h/2)/560}:null};if(flow.stage==='origin'){Object.assign(flow.draft,where);flow.stage='details';return drawFlow()}if(flow.stage==='assist-location'){Object.assign(flow.outcome.assist,where);return finishOutcome()}Object.assign(flow.outcome,where);afterShotLocation()}
function afterShotLocation(){if(flow.outcome.kind==='Goal'){if(flow.draft.opp||flow.draft.type==='Penalty')return finishOutcome();flow.stage='assist-question'}else if(flow.draft.opp&&flow.outcome.result==='Saved'){flow.stage='keeper';flow.quality=0;flow.keeper=nominatedKeeper;flow.chooseKeeper=false}else return finishOutcome();drawFlow()}
function assistAnswer(yes){if(!yes)return finishOutcome();flow.stage='assist-player';drawFlow()}
function finishOutcome(){const r=records.find(r=>r.id===flow.recordId);if(!r)return closeFlow();r.outcome=JSON.parse(JSON.stringify(flow.outcome));const text=resultText(r);closeFlow();renderHome();announce(text)}
function removeResult(id){const r=records.find(r=>r.id===id);if(r)delete r.outcome;renderHome();announce('Outcome removed · restart kept')}
function undoLast(){if(!records.length)return;records.pop();renderHome();announce('Last set piece and linked outcome removed')}
function closeFlow(){flow=null;$('#modal').innerHTML='';renderHome()}
function backFlow(){if(flow.stage==='type')return closeFlow();if(flow.stage==='details'){flow.stage='type';return drawFlow()}if(flow.stage==='origin'){flow.stage='details';return drawFlow()}if(flow.stage==='result'){flow.stage='details';return drawFlow()}flow.stage='result';delete flow.outcome;drawFlow()}
function drawFlow(){let title='',body='';const f=flow,d=f.draft;
if(f.stage==='type'){title='Which set piece?';body=`<div class="grid">${types.map((type,i)=>`<button onclick="chooseType(${i})"><strong>${type}</strong><small>${['Left or right corner','Optional pitch location','Penalty spot assumed'][i]}</small></button>`).join('')}</div>`}
if(f.stage==='details'){title=d.type;body=`<div class="field"><label>Which team?</label><div class="segmented"><button class="${!d.opp?'selected':''}" onclick="setTeam(false)">Blues (Phil)</button><button class="opponent ${d.opp?'selected':''}" onclick="setTeam(true)">Opposition</button></div></div>${!d.opp?`<div class="field"><label for="taker">Taker · optional</label><select id="taker" onchange="flow.draft.taker=this.value"><option value="">Team only / not known</option>${squad.map(n=>`<option ${d.taker===n?'selected':''}>${n}</option>`).join('')}</select></div>`:''}${d.type==='Corner'?`<div class="field"><label>Corner side · looking towards the attacking goal</label><div class="segmented three">${['Left','Right','Unknown'].map(side=>`<button class="${d.cornerSide===side?'selected':''}" onclick="setCorner('${side}')">${side}</button>`).join('')}</div></div>`:''}${d.type==='Free kick'?`<div class="field"><label>Free-kick location · optional</label><p class="hint">${esc(d.locationLabel)}</p><button class="wide" onclick="flow.stage='origin';drawFlow()">Choose pitch location</button></div>`:''}${d.type==='Penalty'?`<div class="banner">${esc(d.locationLabel)} · no pitch-selection step needed.</div>`:''}<button class="primary wide" onclick="saveRestart()">Record ${d.type.toLowerCase()}</button><p class="hint">Next: optionally link a shot or goal. Recording the restart doesn’t add an assist or a goal.</p>`}
if(f.stage==='result'){title='What followed?';body=`<div class="banner">${d.opp?'Opposition':'Blues'} ${d.type.toLowerCase()} recorded · ${fmt(d.at)}${d.taker?' · taker '+esc(d.taker):''}<br>Add the outcome now, or later from the timeline.</div><div class="choices"><button onclick="chooseResult('none')">No key action / add later</button><button onclick="chooseResult('Shot')">${d.type==='Penalty'?'Penalty saved or missed':'Link a shot'}</button><button onclick="chooseResult('Goal')">${d.type==='Penalty'?'Penalty scored':'Link a goal'}</button></div>`}
if(f.stage==='penalty-scorer'){title='Penalty scored by '+d.taker;body=qualityPanel('Goal')+`<section class="players"><h3>Penalty taker · assumed scorer</h3><p class="flow-player">${esc(d.taker)}</p><button class="primary wide" onclick="choosePlayer(flow.draft.taker)">Record goal for ${esc(d.taker)}</button><button class="wide" onclick="flow.stage='player';drawFlow()">Different scorer</button></section>`}
if(f.stage==='player'){title=f.outcome.kind==='Goal'?'Who scored?':'Who took the shot?';body=qualityPanel(f.outcome.kind)+playerButtons('player')}
if(f.stage==='opposition-shot'||f.stage==='shot-result'){title='What happened to the shot?';const outcomes=d.type==='Penalty'?['Saved','Off target']:['Saved','Off target','Blocked'];body=(f.stage==='opposition-shot'?qualityPanel('Shot'):'')+`<div class="choices">${outcomes.map((o,i)=>`<button onclick="chooseShotResult(${i})">${o}</button>`).join('')}</div>`}
if(['origin','shot-location','assist-location'].includes(f.stage)){title=f.stage==='origin'?'Where was the free kick taken?':f.stage==='assist-location'?'Where was the assist played?':'Where was the shot taken?';body=demoPitch()}
if(f.stage==='assist-question'){title='Was there an assist?';body=`<p class="hint">The set-piece taker isn’t automatically counted as the assister.</p><div class="choices">${d.taker&&d.taker!==f.outcome.player?`<button onclick="flow.stage='assist-player';choosePlayer(flow.draft.taker)">Yes · ${esc(d.taker)} (taker)</button>`:''}<button onclick="assistAnswer(true)">Yes · choose player</button><button onclick="assistAnswer(false)">No assist</button></div>`}
if(f.stage==='assist-player'){title='Who made the assist?';body=playerButtons('assist-player')}
if(f.stage==='keeper'){title=f.keeper&&!f.chooseKeeper?'Save by '+f.keeper:'Who made the save?';body=`<div class="banner">Records our keeper’s save linked to the opposition shot and ${d.type.toLowerCase()}.</div>`+qualityPanel('Save')+(f.keeper&&!f.chooseKeeper?`<section class="players"><h3>Nominated goalkeeper</h3><p class="flow-player">${esc(f.keeper)}</p><button class="primary wide" onclick="choosePlayer(flow.keeper)">Record save for ${esc(f.keeper)}</button><button class="wide" onclick="flow.chooseKeeper=true;drawFlow()">Different goalkeeper</button></section>`:playerButtons('keeper'))}
$('#modal').innerHTML=`<div class="modal"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="flow-title"><div class="flow-head"><button aria-label="Back one step" onclick="backFlow()">←</button><div class="eyebrow">${tacticsIcon()}<span> Set piece · ${fmt(d.at)}</span></div><button aria-label="Close set-piece flow" onclick="closeFlow()">×</button></div><h2 id="flow-title">${title}</h2>${body}</section></div>`}
function nominateKeeper(name){nominatedKeeper=squad.includes(name)?name:'';renderHome();announce(nominatedKeeper?'Goalkeeper: '+nominatedKeeper:'No goalkeeper nominated')}
function resetDemo(){nominatedKeeper='E.J';records=[];flow=null;$('#modal').innerHTML='';clockStart=Date.now();renderHome();announce('Demo reset')}
function loadExample(){records=[{id:crypto.randomUUID(),type:'Corner',opp:false,at:180000,taker:'Cae',locationLabel:'Left corner',point:{x:.05,y:.035},outcome:{kind:'Goal',player:'Haydo',quality:'Great goal',at:185000,locationLabel:'Attacking six-yard box, centre',point:{x:.5,y:.08},assist:{player:'Cae',locationLabel:'Left corner',point:{x:.05,y:.035}}}},{id:crypto.randomUUID(),type:'Free kick',opp:true,at:540000,locationLabel:'Defensive penalty area, centre channel',point:{x:.5,y:.8},outcome:{kind:'Shot',player:'Opposition',quality:'Great strike',result:'Saved',at:544000,save:{player:nominatedKeeper||'E.J',quality:'Great save'}}}];renderHome();announce('Example loaded · one corner, one goal; one free kick, one save')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&flow)closeFlow()});setInterval(()=>{const c=$('#clock');if(c)c.textContent=fmt(now())},500);
function demoZones(){const zones=[],add=(x,y,w,h,label,text)=>zones.push({x,y,w,h,label,text,id:'v2-'+zones.length});for(const south of [false,true]){const team=south?'Defensive':'Attacking',y=(v,h)=>south?560-v-h:v;
 ['left','centre','right'].forEach((s,i)=>add(117+i*42,y(18,54),42,54,`${team} six-yard box, ${s}`,['6L','6C','6R'][i]));
 add(60,y(18,138),57,138,`${team} penalty area, far left`,'18L');add(243,y(18,138),57,138,`${team} penalty area, far right`,'18R');
 ['left','centre','right'].forEach((s,i)=>add(117+i*42,y(72,84),42,84,`${team} penalty area, ${s} channel`,['18L','18C','18R'][i]));
 add(18,y(18,138),42,138,`${team} left wing`,'LW');add(300,y(18,138),42,138,`${team} right wing`,'RW');
 ['left','centre','right'].forEach((s,i)=>add(18+i*108,y(156,124),108,124,`${team} midfield, ${s}`,['Left','Centre','Right'][i]));}return zones}
function demoPitch(){return `<p class="v2-pitch-label">OPPOSITION GOAL <span>↑ OUR ATTACK</span></p><div class="v2-pitch"><svg viewBox="0 0 360 560" aria-hidden="true"><defs><pattern id="v2grass" width="360" height="80" patternUnits="userSpaceOnUse"><rect width="360" height="40" fill="#fff" opacity=".04"/></pattern></defs><rect width="360" height="560" fill="url(#v2grass)"/><g fill="none" stroke="#e3f0cf" stroke-width="1.7"><path d="M18 18H342V542H18Z M18 280H342 M60 18V156H300V18 M117 18V72H243V18 M60 542V404H300V542 M117 542V488H243V542 M145 18V6H215V18 M145 542V554H215V542"/><circle cx="180" cy="280" r="40"/><path d="M147 156Q180 186 213 156M147 404Q180 374 213 404 M18 30A12 12 0 0 0 30 18 M330 18A12 12 0 0 0 342 30 M18 530A12 12 0 0 1 30 542 M330 542A12 12 0 0 1 342 530"/></g><g fill="#e3f0cf"><circle cx="180" cy="112" r="2.5"/><circle cx="180" cy="448" r="2.5"/><circle cx="180" cy="280" r="2.5"/><path d="M320 340v-70l-7 12m7-12 7 12" fill="none" stroke="#d6ee83" stroke-width="3"/></g></svg>${demoZones().map((z,i)=>`<button aria-label="${z.label}" onclick="chooseDemoZone(${i})" style="left:${z.x/3.6}%;top:${z.y/5.6}%;width:${z.w/3.6}%;height:${z.h/5.6}%">${z.text}</button>`).join('')}</div><p class="v2-pitch-label">OUR GOAL <span>6 = six-yard · 18 = penalty area</span></p><details class="v2-zone-list"><summary>Choose a named zone instead</summary><div class="v2-choices">${demoZones().map((z,i)=>`<button onclick="chooseDemoZone(${i})">${z.label}</button>`).join('')}</div></details><button class="v2-wide" onclick="chooseDemoZone(-1)">Location unknown</button>`}

renderHome();
</script></body></html>
