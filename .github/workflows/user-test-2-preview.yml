name: User Test 2 — isolated preview build

on:
  push:
    branches: [user-test-2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: user-test-2-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          for file in *.js; do
            node --check "$file"
          done
      - name: Prepare standalone static preview
        run: |
          mkdir -p preview
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.svg' -o -name '*.png' -o -name '*.webp' -o -name '*.jpg' -o -name '*.ico' -o -name '*.json' -o -name '*.woff2' \) -exec cp {} preview/ \;
          test -f preview/index.html
          test -f preview/user-test-2-pitch.js
      - name: Upload preview artifact (does not deploy Pages)
        uses: actions/upload-artifact@v4
        with:
          name: tikitapper-user-test-2-preview
          path: preview/
          retention-days: 14
