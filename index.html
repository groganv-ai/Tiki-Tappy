:root{--ink:#193e35;--green:#215e49;--lime:#d6ee83;--paper:#f5f5ed;--muted:#78857a;--line:#dce2d5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #c39a38}button{border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:white;color:var(--ink);font-weight:650}button:hover{filter:brightness(.97)}button.primary{background:var(--green);color:white;border-color:var(--green)}button.active{background:var(--lime);border-color:#aec765}button:disabled{opacity:.5;cursor:default}header{background:#133f36;color:white;padding:22px max(22px,calc((100vw - 1160px)/2));display:flex;align-items:center;justify-content:space-between}.brand{font-size:25px;letter-spacing:-1px;font-weight:850}.brand i{color:var(--lime);font-style:normal}.tag{font-size:11px;letter-spacing:2px;color:#bad0bf}nav{display:flex;gap:8px}nav button{background:transparent;color:#c5d7cb;border:0}nav button.active{color:#173b30}main{max-width:1160px;margin:32px auto;padding:0 22px 60px}.eyebrow{font:700 11px system-ui;letter-spacing:2px;text-transform:uppercase;color:#6b7a68}h1{font-size:36px;letter-spacing:-1.5px;margin:8px 0}h2{font-size:20px;margin:0 0 16px}p{line-height:1.6}.sub{color:#718070;margin-top:8px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:28px}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:24px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:20px}.score{background:#143f36;color:white;position:relative;overflow:hidden;text-align:center;padding:26px;border-radius:18px}.score .eyebrow{color:#bdd3ac}.scoreline{display:grid;grid-template-columns:1fr 100px 1fr;align-items:center;gap:10px;margin:22px 0}.scoreline strong{font-size:40px;letter-spacing:3px}.crest{width:42px;heigh --ink)}textarea{min-height:110px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.squad{display:flex;flex-wrap:wrap;gap:8px}.squad button{font-size:13px}.squad button.selected{background:#d6ee83;border-color:#b8cf82}.modal{position:fixed;inset:0;background:#102b25a8;z-index:5;display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(4px)}.sheet{background:var(--paper);width:480px;max-height:94dvh;overflow:auto;border-radius:20px;padding:24px}.close{float:right;padding:6px 11px}.pitch{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;padding:8px;background:#386b4b;border:3px solid #bdd3ac;border-radius:8px;position:relative}.pitch button{background:#ffffff08;color:#dcebd1;border:1px solid #ffffff40;border-radius:0;height:64px;font-size:12px}.pitch button.active{background:#d6ee83;color:#17402e}.pitchlabel{text-align:center;font-size:10px;letter-spacing:2px;margin:12px}.retro{background:#122b36;color:#d2ebe0;border-radius:10px;overflow:hidden;font:13px ui-monospace,monospace}.retrohead{background:#215c58;padding:15px;color:#e9f3b1;display:flex;justify-content:space-between}.retrobody{padding:22px}.retro h2{font:700 23px ui-monospace,monospace;color:#fff}.retro .event{border-color:#31505a}.retro time{color:#dbeb8b}.retro small{color:#91b4b1}.retro p{white-space:pre-wrap}.photo{width:100%;max-height:280px;object-fit:cover;border-radius:8px;margin:15px 0}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#183f32;color:white;padding:12px 20px;border-radius:12px;z-index:20;font-size:13px}.foot{font-size:11px;color:#8b9587;text-align:center;margin:20px}.links{display:flex;gap:8px;flex-wrap:wrap}.danger{color:#ad4545}.hidden{display:none}@media(max-width:760px){header{padding:16px 18px}.brand{font-size:22px}.tag{display:none}nav{gap:0}nav button{padding:10px;font-size:12px}main{margin-top:23px;padding:0 14px 40px}h1{font-size:28px}.layout{grid-template-columns:1fr;gap:0}.top{margin-bottom:20px}.card{padding:19px}.top>button{font-size:12px;padding:11px}.action{min-height:79px;font-size:13px}.row{gap:10px}.scoreline{grid-template-columns:1fr 80px 1fr;font-size:13px}.scoreline strong{font-size:33px}.sheet{padding:20px}.retrobody{padding:16px}.matches button{font-size:13px}}
.matrixwrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.matrix{border-collapse:separate;border-spacing:0;width:100%;min-width:540px;font-size:11px}.matrix th{padding:12px 4px;background:#edf2e5;position:sticky;top:0;font-size:10px}.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:#f5f7ee;z-index:1;min-width:55px;max-width:110px;text-align:left;padding:10px;font-size:12px}.matrix th:first-child{z-index:2}.matrix td{border-top:1px solid #e7ecdf;text-align:center;padding:3px}.matrix button{padding:0;width:44px;min-height:44px;border-radius:8px;font-size:19px;background:#f5f8ed}.quality{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.quality button{min-height:80px}.matrix td:nth-child(2) button{background:#e2edc6}@media(max-width:520px){header{flex-wrap:wrap;gap:12px}header nav{width:100%;justify-content:space-between}nav button{padding:10px 8px}}body{min-height:100dvh;display:flex;flex-direction:column}body>header{flex-shrink:0}main#app{flex:1;width:100%}.copyright-footer{max-width:1160px;width:100%;margin:0 auto;padding:18px 22px calc(18px + env(safe-area-inset-bottom));text-align:center;border-top:1px solid var(--line);color:#718070;font-size:11px;line-height:1.5}.brand{display:block;line-height:0;width:225px;max-width:100%;height:auto;overflow:visible}.brand img{display:block;width:100%;height:auto;max-width:100%;object-fit:contain;transform:none}.header-identity>div{min-width:0}@media(max-width:760px){.brand{width:200px}}@media(max-width:380px){.brand{width:175px}}</style><header><div class="header-identity"><div><div class="brand"><img src="assets/tikitapper-wordmark.png?v=30" alt="TikiTapper" width="2048" height="683" fetchpriority="high"></div><div class="tag">SMALL MOMENTS. BIG MEMORIES.</div></div><button class="demo-button" onclick="demo()">Try a demo</button></div><nav id="nav"></nav></header><main id="app"></main><footer class="copyright-footer">© 2026 Vincent Grogan. All rights reserved.</footer><div id="modal"></div><div id="toast" class="hidden"></div><script src="timing.js?v=27"></script><script>
const KEY='tikitapper-v1',actions=['Goal','Assist','Great skill','Great pass','Great tackle','Save','Great Save','Team work','Sportsmanship'],icons=['⚽','↗','✧','➜','⊥','◇','✦','∞','♡'];
const fresh=()=>({"clubName":"AFC Whitchurch U10s","clubDefaultsVersion":1,"teams":[{"name":"Blues (Phil)","squad":["Haydo","Cae","E.J","Hughesy","Macca","Dyls","Coops","Richy","Rafa"]},{"name":"Yellow (Bob)","squad":["Osh","Otto","Henners","Champ","Luca","Ben R","Elijah D","Flynn","Josh","Wearny"]}],"days":[],"selected":null});let data;try{data=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{data=fresh()}let view='home',mi=0,pending=null,compactNames=!(window.matchMedia?.("(max-width:760px)").matches);const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const day=()=>data.days.find(d=>d.id===data.selected),match=()=>day()?.matches[mi];const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{toast('Storage is full. Export a backup before adding more photos.')}};function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),3200)}function elapsed(m){return (m.elapsed||0)+(m.running?Math.max(0,Date.now()-m.started):0)}function fmt(ms){let s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function score(m){return [m.events.filter(e=>e.action==='Goal'&&!e.opp).length,m.events.filter(e=>e.action==='Goal'&&e.opp).length]}function changeMatch(index){
 if(!Number.isInteger(index)||index<0||index>=day().matches.length)return;
 if(typeof cancelActionHold==='function')cancelActionHold();
 if(typeof cancelClockHold==='function')cancelClockHold();
 mi=index;render();
}
function tabs(){const d=day(),m=match();return `<div class="matches">${d.matches.map((item,i)=>`<button class="${i===mi?'active':''}" aria-current="${i===mi?'true':'false'}" onclick="changeMatch(${i})"><small>MATCH ${i+1} · ${esc(item.time||'Kick-off TBC')}</small>vs ${esc(item.opponent)} ${item.ended?' · FT':''}</button>`).join('')}</div><div class="match-stepper" aria-label="Choose match"><button aria-label="Previous match" onclick="changeMatch(${mi-1})" ${mi===0?'disabled':''}>‹</button><div aria-live="polite"><small>Match ${mi+1} of ${d.matches.length} · ${esc(m.time||'Kick-off TBC')}${m.ended?' · FT':''}</small><strong>vs ${esc(m.opponent)}</strong></div><button aria-label="Next match" onclick="changeMatch(${mi+1})" ${mi===d.matches.length-1?'disabled':''}>›</button></div>`}
function eventHTML(e,remove=false){return `<div class="event"><time>${eventTimeLabel(e)}</time><div><strong>${esc(e.player)} · ${esc(e.action)}</strong><small>${e.opp?'Opposition':esc(day().team)} · ${e.zone?`Zone ${e.zone} · ${zoneName(e.zone)}`:'Location not recorded'}</small></div>${remove?`<button aria-label="Delete event" onclick="delEvent('${e.id}')">×</button>`:''}</div>`}function zoneName(z){return ['Defensive','Defensive','Defensive','Middle','Middle','Middle','Attacking','Attacking','Attacking','Goal area','Goal area','Goal area'][z-1]+' '+['left','centre','right'][(z-1)%3]}function render(){if(day()&&mi>=day().matches.length)mi=0;$('#nav').innerHTML=['home','live','setup','report'].map((x,i)=>`<button class="${view===x?'active':''}" onclick="view='${x}';render()">${['Home','Match centre','Manage','Report'][i]}</button>`).join('');if(view==='home')return welcome();if(view==='setup')return renderSetup();if(!day())return welcome();if(view==='report')return renderReport();let m=match(),s=score(m);$('#app').innerHTML=`<div class="top"><div><p class="sub">${esc(day().date)} · ${esc(day().location)}</p></div><button onclick="view='setup';render()">Edit matchday ↗</button></div>${tabs()}<div class="layout"><div><div class="score"><div class="eyebrow">${m.ended?'Full time':m.running?'● Match in progress':'Ready when you are'} · Match ${mi+1} of ${day().matches.length}</div><div class="scoreline"><div><div class="crest">TT</div>${esc(day().team)}</div><strong>${s[0]}–${s[1]}</strong><div><div class="crest">${esc(m.opponent.slice(0,2).toUpperCase())}</div>${esc(m.opponent)}</div></div><div class="clock" id="clock">${clockText(m)}</div><div class="controls"><button class="primary" onclick="toggleClock()">${m.running?'Ⅱ Pause':m.ended?'Resume match':'▶ '+(m.elapsed?'Resume':'Start match')}</button><button onclick="endMatch()">Full time</button></div></div><div class="card" style="margin-top:20px"><div class="sectionhead"><h2>Record a moment</h2><span class="pill">${m.lineup.length} players</span></div><div class="matrixwrap"><table class="matrix"><thead><tr><th><button style="width:auto;padding:5px;min-height:34px;font-size:10px" onclick="compactNames=!compactNames;render()">${compactNames?'INITIALS ⇄':'NAMES ⇄'}</button></th>${gridActions.map(a=>`<th>${a.label}</th>`).join('')}</tr></thead><tbody>${m.lineup.map((n,pi)=>`<tr><th scope="row" title="${esc(n)}">${esc(playerLabel(n))}</th>${gridActions.map((a,ai)=>`<td><button aria-label="${esc(n)}: ${a.label}" title="${a.label}" onclick="gridEvent(${pi},${ai})">${a.icon}</button></td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="opponents"><button onclick="beginEvent(0,true)">+ Opposition goal</button><button onclick="beginEvent(5,true)">+ Opposition save</button></div><p class="hint">Tap beside a player → choose quality → pitch zone. Swipe actions sideways. Time captured on your first tap.</p></div></div><aside><div class="card"><div class="sectionhead"><h2>Match timeline</h2><span class="pill">${m.events.length} moments</span></div><div class="timeline">${m.events.length?[...m.events].sort((a,b)=>b.at-a.at).map(e=>eventHTML(e,true)).join(''):'<div class="empty">The story starts here.<br>Start the clock and capture a moment.</div>'}</div><button style="width:100%;margin-top:18px" onclick="view='report';render()">View match report ↗</button></div><div class="card"><div class="sectionhead"><h2>Today’s lineup</h2><button style="padding:6px 10px;font-size:11px" onclick="lineupModal()">Edit</button></div><div class="squad">${m.lineup.map(n=>`<span class="pill">${esc(n)}</span>`).join('')||'<p class="hint">Choose players before logging moments.</p>'}</div></div><p class="foot"><span class="dot"></span>Saved on this device · Backup in Manage</p></aside></div>`}
function welcome(){$('#app').innerHTML=`<div class="layout home-layout"><div class="card"><h2>A whole matchday, in your pocket.</h2><p>Pick your team and today’s players. Add each opponent, start the clock and capture the goals, great tackles and acts of kindness that make youth football special.</p><div class="home-actions"><button class="primary" onclick="view='setup';render()">New Matchday</button>${day()?`<button onclick="view='live';render()">Return to match ↗</button>`:''}</div></div><div class="score home-toolkit"><div class="eyebrow">Your matchday toolkit</div><h2>Watch. Tap. Remember.</h2><p>7 player actions<br>12 pitch zones<br>Every match. One story.</p><div class="clock">00:00</div></div></div><footer class="home-footer"><h2>Little players. Big moments.</h2><p>Less typing. More watching the game.</p></footer>`}
function toggleClock(){let m=match();if(m.running){m.elapsed=elapsed(m);m.running=false}else{m.running=true;m.started=Date.now();m.ended=false}save();render()}function endMatch(){let m=match();m.elapsed=elapsed(m);m.running=false;m.ended=true;save();render();toast('Full time. Your report is ready.')}function delEvent(id){match().events=match().events.filter(e=>e.id!==id);save();render()}
function beginEvent(i,opp=false){let m=match();if(!m.running&&!m.elapsed&&!m.ended)return toast('Start the match clock first.');if(!opp&&!m.lineup.length)return lineupModal();pending={id:crypto.randomUUID(),action:actions[i],at:elapsed(m),opp,player:opp?'Opposition':'',zone:null};eventModal()}
function playerLabel(n){if(!compactNames)return n;let parts=n.trim().split(/\s+/),initials=parts.map(p=>Array.from(p)[0]).join('').toUpperCase();let names=match().lineup,duplicates=names.filter(other=>other.trim().split(/\s+/).map(p=>Array.from(p)[0]).join('').toUpperCase()===initials);return initials+(duplicates.length>1?' '+(duplicates.indexOf(n)+1):'')}
const gridActions=[{label:'Goal',icon:'⚽',base:'Goal'},{label:'Assist',icon:'↗',base:'Assist'},{label:'Skill',icon:'✧',base:'skill',quality:true},{label:'Pass',icon:'➜',base:'pass',quality:true},{label:'Tackle',icon:'⊥',base:'tackle',quality:true},{label:'Save',icon:'◇',base:'save',quality:true},{label:'Teamwork',icon:'∞',base:'Team work'},{label:'Sport',icon:'♡',base:'Sportsmanship'}];
function gridEvent(pi,ai){let m=match();if(!m.running&&!m.elapsed&&!m.ended)return toast('Start the match clock first.');let a=gridActions[ai];pending={id:crypto.randomUUID(),action:a.base,at:elapsed(m),opp:false,player:m.lineup[pi],zone:null};if(a.quality){$('#modal').innerHTML=`<div class="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div class="eyebrow">${fmt(pending.at)} · ${esc(pending.player)}</div><h2 style="margin-top:14px">How was that ${a.base}?</h2><div class="quality">${['Good','Great','Amazing'].map(q=>`<button onclick="chooseQuality('${q}')">${q}</button>`).join('')}</div><p class="hint">Next: choose where it happened.</p></div></div>`}else eventModal()}
function chooseQuality(q){pending.quality=q;pending.action=q+' '+pending.action;eventModal()}
function eventModal(){let p=pending;$('#modal').innerHTML=`<div class="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div class="eyebrow">${fmt(p.at)} · Record a moment</div><h2 style="margin-top:12px">${esc(p.action)}</h2>${!p.player?`<p>Who made it happen?</p><div class="squad">${match().lineup.map(n=>`<button onclick="pickPlayer(this.dataset.name)" data-name="${esc(n)}">${esc(n)}</button>`).join('')}</div>`:`<p><strong>${esc(p.player)}</strong> · Where did it happen?</p><div class="pitchlabel">ATTACKING ↑ · ZONES RELATIVE TO YOUR TEAM</div><div class="pitch">${[10,11,12,7,8,9,4,5,6,1,2,3].map(z=>`<button onclick="finishEvent(${z})" aria-label="Zone ${z}, ${zoneName(z)}">${z}<br><small>${zoneName(z)}</small></button>`).join('')}</div><button style="width:100%;margin-top:12px" onclick="finishEvent(null)">Save without a location</button>`}</div></div>`}function pickPlayer(n){pending.player=n;eventModal()}function finishEvent(z){pending.zone=z;match().events.push(pending);pending=null;save();closeModal();render();toast('Moment recorded')}function closeModal(){$('#modal').innerHTML='';pending=null}function lineupModal(){let m=match(),t=data.teams.find(t=>t.name===day().team)||data.teams[day().teamIndex||0];$('#modal').innerHTML=`<div class="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div class="eyebrow">Match ${mi+1}</div><h2 style="margin-top:12px">Pick today’s lineup</h2><p class="hint">Tap each player available for this match.</p><div class="squad">${t.squad.map(n=>`<button data-name="${esc(n)}" class="${m.lineup.includes(n)?'selected':''}" onclick="togglePlayer(this)">${esc(n)}</button>`).join('')}</div><button class="primary" style="width:100%;margin-top:20px" onclick="closeModal();render()">Done</button></div></div>`}function togglePlayer(b){let a=match().lineup,n=b.dataset.name;if(a.includes(n))a.splice(a.indexOf(n),1);else a.push(n);b.classList.toggle('selected');save()}
function renderSetup(){let d=day();$('#app').innerHTML=`<div class="top"><div><div class="eyebrow">Before the whistle</div><h1>Make it your matchday.</h1><p class="sub">Two teams. Every opponent. All the little details.</p></div></div><div class="layout"><div><form class="card" onsubmit="createDay(event)"><h2>Create a new matchday</h2><div class="row"><div class="field"><label>Your team</label><select name="team">${data.teams.map((t,i)=>`<option value="${i}">${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Date</label><input name="date" type="date" required value="${new Date().toLocaleDateString('en-CA')}"></div></div><div class="field"><label>Location / venue</label><input name="location" placeholder="e.g. Riverside playing fields" required></div><div class="field"><label>Opponents — one per line (name, kick-off time)</label><textarea name="opponents" required placeholder="Riverside Juniors, 10:00\nParkside FC, 10:30\nOakwood United, 11:00"></textarea></div><p class="hint">Each opponent gets its own clock, lineup, timeline and report.</p><button class="primary">Create matchday ↗</button></form>${d?`<form class="card" onsubmit="updateDay(event)"><h2>Current matchday details</h2><div class="row"><input name="date" type="date" value="${esc(d.date)}" required><input name="location" value="${esc(d.location)}" required aria-label="Location"></div>${d.matches.map((m,i)=>`<div class="row" style="margin-top:12px"><input name="opp${i}" value="${esc(m.opponent)}" required aria-label="Match ${i+1} opponent"><input name="time${i}" type="time" value="${esc(m.time)}" aria-label="Kick-off time"></div>`).join('')}<button style="margin-top:15px">Save details</button></form>`:''}<div class="card"><h2>Matchday archive</h2>${data.days.length?data.days.map(d=>`<button style="width:100%;text-align:left;margin-bottom:8px" onclick="data.selected='${d.id}';mi=0;save();view='live';render()">${esc(d.date)} · ${esc(d.team)}<small style="display:block;font-weight:400;margin-top:5px">${esc(d.location)} · ${d.matches.length} matches</small></button>`).join(''):'<p class="hint">Your matchdays will appear here.</p>'}</div></div><aside><form class="card" onsubmit="saveTeams(event)"><h2>Your two teams</h2><p class="hint">Sample names are placeholders. Enter your actual squads below, one player per line.</p>${data.teams.map((t,i)=>`<div class="field"><label>Team ${i+1} name</label><input name="name${i}" required value="${esc(t.name)}"></div><div class="field"><label>Squad</label><textarea name="squad${i}" required>${esc(t.squad.join('\n'))}</textarea></div>`).join('')}<button class="primary">Save teams & squads</button></form><div class="card"><h2>Keep your memories</h2><p class="hint">Data stays in this browser. Transfer a backup to continue on another phone; devices do not sync automatically.</p><div class="links"><button onclick="backup()">Export backup</button><button onclick="$('#import').click()">Import backup</button></div><input hidden id="import" type="file" accept="application/json" onchange="importBackup(this)"></div></aside></div>`}
function createDay(e){e.preventDefault();let f=new FormData(e.target),ti=+f.get('team'),opps=f.get('opponents').split('\n').map(x=>x.trim()).filter(Boolean);if(!opps.length)return;let d={id:crypto.randomUUID(),team:data.teams[ti].name,teamIndex:ti,date:f.get('date'),location:f.get('location'),summary:'',photo:'',matches:opps.map(x=>{let [opponent,time='']=x.split(',');return{opponent:opponent.trim(),time:time.trim(),lineup:[...data.teams[ti].squad],events:[],elapsed:0,running:false,ended:false,summary:''}})};data.days.unshift(d);data.selected=d.id;mi=0;save();view='live';render();lineupModal()}function updateDay(e){e.preventDefault();let f=new FormData(e.target),d=day();d.date=f.get('date');d.location=f.get('location');d.matches.forEach((m,i)=>{m.opponent=f.get('opp'+i);m.time=f.get('time'+i)});save();toast('Matchday updated')}function saveTeams(e){e.preventDefault();let f=new FormData(e.target);data.teams=data.teams.map((t,i)=>({name:f.get('name'+i).trim(),squad:[...new Set(f.get('squad'+i).split('\n').map(x=>x.trim()).filter(Boolean))]}));save();toast('Teams saved');render()}
function reportText(all=true){let d=day(),ms=all?d.matches:[match()];return `${d.team} — Matchday report\n${d.date} · ${d.location}\n\n`+ms.map(m=>{let s=score(m);return `${d.team} ${s[0]}–${s[1]} ${m.opponent}${m.ended?' (FT)':' (in progress)'}\nKick-off: ${m.time||'Not set'}\nLineup: ${m.lineup.join(', ')}\n`+[...m.events].sort((a,b)=>a.at-b.at).map(e=>`${eventTimeLabel(e)} ${e.player}: ${e.action}${e.zone?' · Zone '+e.zone:''}`).join('\n')+(m.summary?'\n'+m.summary:'')}).join('\n\n')+(d.summary?'\n\nCoach’s summary\n'+d.summary:'')}
function renderReport(){let d=day(),m=match(),s=score(m);$('#app').innerHTML=`<div class="top"><div><div class="eyebrow">The matchday story</div><h1>Moments worth sharing.</h1><p class="sub">Your touchline notes, turned into a match report.</p></div><button class="primary" onclick="shareReport()">Share report ↗</button></div>${tabs()}<div class="layout"><div><div class="retro"><div class="retrohead"><b>TIKITAPPER / MATCH REPORT</b><span>${m.ended?'FULL TIME':'MATCH NOTES'}</span></div><div class="retrobody"><div style="color:#9db6ad;font-size:11px">${esc(d.date)} · ${esc(m.time)} · ${esc(d.location)}</div><h2 style="margin-top:20px">${esc(d.team)} ${s[0]}–${s[1]} ${esc(m.opponent)}</h2><p style="font-size:11px;color:#9fbab0">LINEUP · ${esc(m.lineup.join(' · '))}</p>${m.events.length?[...m.events].sort((a,b)=>a.at-b.at).map(e=>eventHTML(e)).join(''):'<p>No moments recorded yet.</p>'}${m.summary?`<p>${esc(m.summary)}</p>`:''}${d.photo?`<img class="photo" src="${d.photo}" alt="Matchday photo">`:''}${d.summary?`<p style="color:#ddeb94">COACH’S NOTES</p><p>${esc(d.summary)}</p>`:''}<div style="font-size:10px;color:#89aaa2;margin-top:25px">SMALL MOMENTS. BIG MEMORIES. / TIKITAPPER</div></div></div></div><aside><div class="card"><h2>Add the finishing touches</h2><div class="field"><label>Match ${mi+1} summary</label><textarea id="matchsummary" placeholder="A few words about this match…" onchange="match().summary=this.value;save();render()">${esc(m.summary)}</textarea></div><div class="field"><label>Whole matchday summary</label><textarea placeholder="A brilliant morning of teamwork…" onchange="day().summary=this.value;save();render()">${esc(d.summary)}</textarea></div><div class="field"><label>Matchday photo</label><input type="file" accept="image/*" onchange="addPhoto(this)"></div>${d.photo?'<button onclick="day().photo=\'\';save();render()">Remove photo</button>':''}<p class="hint">Use a photo you have permission to share with the group.</p></div><div class="card"><h2>From touchline to group chat</h2><p class="hint">Share a concise text report for the whole day, or create a retro image or short timeline video for this match.</p><div class="links"><button onclick="shareReport()">Share text</button><button onclick="exportImage()">Report image</button><button id="videoBtn" onclick="exportVideo()">Timeline video</button><button onclick="downloadText()">Save text</button></div><p class="hint">Choose WhatsApp in your phone’s share menu. Video export uses WebM where supported; image and text are the reliable fallbacks.</p></div></aside></div>`}
async function addPhoto(input){let f=input.files[0];if(!f)return;try{let img=await createImageBitmap(f),c=document.createElement('canvas'),ratio=Math.min(1,1200/img.width);c.width=img.width*ratio;c.height=img.height*ratio;c.getContext('2d').drawImage(img,0,0,c.width,c.height);day().photo=c.toDataURL('image/jpeg',.75);save();render()}catch{toast('This image could not be opened. Try a JPEG or PNG.')}}function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),20000)}async function shareFile(blob,name){let f=new File([blob],name,{type:blob.type});if(navigator.canShare?.({files:[f]})){try{await navigator.share({files:[f],title:'TikiTapper match report'})}catch(e){if(e.name!=='AbortError')download(blob,name)}}else{download(blob,name);toast('Saved. Attach this file in WhatsApp.')}}async function shareReport(){let text=reportText();if(navigator.share){try{await navigator.share({title:'Matchday report',text})}catch(e){if(e.name!=='AbortError')downloadText()}}else{try{await navigator.clipboard.writeText(text);toast('Report copied. Paste it into your group chat.')}catch{downloadText()}}}function downloadText(){download(new Blob([reportText()],{type:'text/plain'}),'matchday-report.txt')}
async function reportCanvas(events=match().events){let c=document.createElement('canvas');c.width=1080;c.height=Math.max(1200,520+events.length*72+(day().photo?420:0)+(day().summary?180:0));let x=c.getContext('2d');x.fillStyle='#122b36';x.fillRect(0,0,c.width,c.height);x.fillStyle='#215c58';x.fillRect(0,0,1080,95);x.fillStyle='#e6f0a3';x.font='bold 27px monospace';x.fillText('TIKITAPPER / MATCH REPORT',45,59);let y=145;const wrap=(text,size,color,max=970)=>{x.font=size+'px monospace';x.fillStyle=color;for(let paragraph of String(text).split('\n')){let line='';for(let w of paragraph.split(' ')){if(x.measureText(line+w).width>max){x.fillText(line,45,y);y+=size*1.4;line=''}line+=w+' '}x.fillText(line,45,y);y+=size*1.4}};let m=match(),d=day(),s=score(m);wrap(`${d.date} | ${m.time||''} | ${d.location}`,21,'#a3c0b6');y+=25;wrap(`${d.team} ${s[0]}–${s[1]} ${m.opponent}`,34,'#fff');wrap(m.ended?'FULL TIME':'MATCH NOTES',18,'#ddeb94');y+=15;wrap('LINEUP: '+m.lineup.join(', '),19,'#a3c0b6');y+=20;for(let e of [...events].sort((a,b)=>a.at-b.at)){wrap(`${eventTimeLabel(e)}  ${e.player} · ${e.action}`,23,'#dfedb5');if(e.zone)wrap('       Zone '+e.zone+' · '+zoneName(e.zone),16,'#91b4b1');y+=10}if(m.summary){y+=15;wrap(m.summary,22,'#d2ebe0')}if(d.photo){let img=new Image();img.src=d.photo;await img.decode();let h=Math.min(360,970*img.height/img.width);x.drawImage(img,45,y,970,h);y+=h+35}if(d.summary){wrap('COACH’S NOTES',20,'#e3ed9a');wrap(d.summary,22,'#d2ebe0')}wrap('SMALL MOMENTS. BIG MEMORIES.',16,'#86aaa1');return c}async function exportImage(){try{let c=await reportCanvas();c.toBlob(b=>shareFile(b,'match-report.png'),'image/png')}catch{toast('Could not create image. Save the text report instead.')}}async function exportVideo(){if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)return toast('Video export is unavailable here. Use Report image instead.');let b=$('#videoBtn');b.disabled=true;b.textContent='Creating…';try{let out=document.createElement('canvas');out.width=720;out.height=1080;let ctx=out.getContext('2d'),stream=out.captureStream(10),mime=['video/webm;codecs=vp8','video/webm','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t));if(!mime)throw Error();let rec=new MediaRecorder(stream,{mimeType:mime}),chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};let done=new Promise(resolve=>rec.onstop=resolve);let frames=[];let es=[...match().events].sort((a,b)=>a.at-b.at);for(let n=0;n<=es.length;n++)frames.push(await reportCanvas(es.slice(0,n)));rec.start();for(let f of frames){ctx.fillStyle='#122b36';ctx.fillRect(0,0,720,1080);let scale=Math.min(720/f.width,1080/f.height);ctx.drawImage(f,0,20,f.width*scale,f.height*scale);await new Promise(r=>setTimeout(r,1100))}rec.stop();await done;stream.getTracks().forEach(t=>t.stop());await shareFile(new Blob(chunks,{type:mime.split(';')[0]}),'match-timeline.'+(mime.includes('mp4')?'mp4':'webm'))}catch{toast('Video export failed in this browser. Use Report image.')}finally{b.disabled=false;b.textContent='Timeline video'}}
function backup(){download(new Blob([JSON.stringify(data)],{type:'application/json'}),'tikitapper-backup.json')}async function importBackup(input){try{let d=JSON.parse(await input.files[0].text());if(!Array.isArray(d.teams)||d.teams.length!==2||!Array.isArray(d.days)||d.teams.some(t=>typeof t.name!=='string'||!Array.isArray(t.squad))||d.days.some(d=>!d.id||!Array.isArray(d.matches)||!d.matches.length||d.matches.some(m=>!Array.isArray(m.events)||!Array.isArray(m.lineup))))throw Error();if(!confirm('Replace this device’s data with the backup? Export your current data first if needed.'))return;data=d;data.days.forEach(d=>d.matches.forEach(m=>{m.running=false}));mi=0;save();render();toast('Backup restored')}catch{toast('Invalid backup. Choose a TikiTapper JSON backup.')}}function demo(){let d={id:crypto.randomUUID(),team:data.teams[0].name,teamIndex:0,date:new Date().toLocaleDateString('en-CA'),location:'Riverside playing fields · Demo',summary:'A brilliant team effort, full of encouragement and some lovely passing. Well done everyone!',matches:['Riverside Juniors','Parkside FC','Oakwood United'].map((o,i)=>({opponent:o,time:['10:00','10:30','11:00'][i],lineup:data.teams[0].squad.slice(0,7),events:[],elapsed:0,running:false,ended:false,summary:''}))};d.matches[0].elapsed=12*60000;d.matches[0].events=[{id:crypto.randomUUID(),at:124000,action:'Great tackle',player:data.teams[0].squad[0],zone:2},{id:crypto.randomUUID(),at:289000,action:'Goal',player:data.teams[0].squad[1],zone:11},{id:crypto.randomUUID(),at:420000,action:'Great Save',player:data.teams[0].squad[2],zone:2},{id:crypto.randomUUID(),at:531000,action:'Sportsmanship',player:data.teams[0].squad[3],zone:5}];data.days.unshift(d);data.selected=d.id;mi=0;save();view='live';render()}
setInterval(()=>{let c=$('#clock');if(c&&match())c.textContent=clockText(match())},500);render();
</script><div id="actionFeedback" class="action-feedback hidden" role="status" aria-live="polite" aria-atomic="true"></div><link rel="stylesheet" href="updates.css?v=27"><script src="updates.js?v=27"></script><link rel="stylesheet" href="touch.css?v=27"><script src="touch.js?v=27"></script><link rel="stylesheet" href="undo.css?v=27"><script src="undo.js?v=27"></script><script src="clock.js?v=27"></script><script src="match-settings.js?v=27"></script><script src="highlights.js?v=27"></script><script src="awards.js?v=27"></script><script src="action-icons.js?v=27"></script><script src="team-profile.js?v=27"></script><script src="coach-mode.js?v=27"></script><link rel="stylesheet" href="mobile.css?v=27"><script src="view-layout.js?v=27"></script></html>
